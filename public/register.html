<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Register - ClubSphere</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>

<body>

<nav>

    <h2>ClubSphere</h2>

    <div>

        <a href="index.html">Home</a>

        <a href="login.html">Login</a>

    </div>

</nav>

<main class="container">

    <h1>Create Account</h1>

    <form id="registerForm">

        <input
            type="text"
            id="name"
            placeholder="Full Name"
            required
        >

        <input
            type="email"
            id="email"
            placeholder="Email"
            required
        >

        <input
            type="password"
            id="password"
            placeholder="Password"
            required
        >

        <button type="submit">
            Register
        </button>

    </form>

    <p
        id="message"
        class="message"
    ></p>

</main>

<script src="js/register.js"></script>

</body>

</html>
