<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>ClubSphere</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>

<body>

<nav>

    <h2>ClubSphere</h2>

    <div>

        <a href="index.html">Home</a>

        <a href="clubs.html">Clubs</a>

        <a href="login.html">Login</a>

        <a href="register.html">Register</a>

    </div>

</nav>

<main class="hero">

    <h1>Welcome to ClubSphere</h1>

    <p>
        Student Club & Membership Management System
    </p>

    <p>
        Discover clubs, join communities and participate
        in student activities.
    </p>

    <div>

        <a
            class="button"
            href="clubs.html"
        >
            Explore Clubs
        </a>

        <a
            class="button secondary"
            href="register.html"
        >
            Register
        </a>

    </div>

</main>

<footer class="footer">
    Running commit:
    <span id="commitId">local</span>
</footer>

<script>
async function loadCommitId() {
    try {
        const response = await fetch("/api/version");
        const data = await response.json();

        document.getElementById("commitId").textContent = data.commit;
    } catch (error) {
        console.error(error);
    }
}

loadCommitId();
</script>

</body>

</html>
