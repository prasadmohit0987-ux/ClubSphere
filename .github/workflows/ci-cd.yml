name: ClubSphere CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:

  test:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run tests
        run: npm test

  build:

    needs: test

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build \
            --build-arg GIT_SHA=${{ github.sha }} \
            -t clubsphere .

      - name: Run container
        run: |
          docker run -d \
            --name clubsphere \
            -p 3000:3000 \
            clubsphere

      - name: Wait for application
        run: sleep 5

      - name: Health check
        run: curl -f http://localhost:3000/health

  deploy:

    needs: build

    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    runs-on: ubuntu-latest

    steps:

      - name: Deploy to Render
        run: |
          curl -fsS -X POST \
          "${{ secrets.RENDER_DEPLOY_HOOK }}&ref=${{ github.sha }}"